[package]
name = "sinaide"
version = "0.5.2"
description = "A strange little creative world for making software."
authors = ["SinaIDE"]
edition = "2021"

[lib]
name = "sinaide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
sha2 = "0.10"
tempfile = "3"
ignore = "0.4"
portable-pty = "0.9"
url = "2"
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
