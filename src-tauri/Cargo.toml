[package]
name = "sinaide"
version = "0.1.0"
description = "A strange little creative world for making software."
authors = ["SinaIDE"]
edition = "2021"

[lib]
name = "sinaide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
